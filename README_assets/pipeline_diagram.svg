<svg width="680" viewBox="0 0 680 1060" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Vulkan GPU-Driven Rendering Pipeline</title>
<desc>GPU-Driven 렌더링 파이프라인 전체 구조도. 보라색은 본인 구현.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- 배경 -->
<rect width="680" height="1060" fill="#f9f8f6"/>

<g transform="translate(0, 50)">

<!-- 범례 -->
<rect x="40" y="24" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="58" y="34" font-family="sans-serif" font-size="12" fill="#555550" dominant-baseline="central">본인 구현 / 自分で実装</text>

<!-- ── CPU ── rect: y=56 h=72 → 중앙y=92 → 줄: 74 / 92 / 110 -->
<rect x="40" y="56" width="600" height="72" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="74" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">CPU — Scene data</text>
<text x="340" y="92" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">메시 정보 · 오브젝트 목록 · 카메라 행렬 준비</text>
<text x="340" y="110" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">メッシュ情報・オブジェクト一覧・カメラ行列の準備</text>

<line x1="340" y1="128" x2="340" y2="150" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Batch System ── rect: y=152 h=128 → 중앙y=216 -->
<rect x="40" y="152" width="600" height="128" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="172" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">GPU — Batch system</text>

<!-- UBO: rect y=192 h=74 → 중앙y=229 → 줄: 211 / 229 / 247 -->
<rect x="58" y="192" width="168" height="74" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="142" y="211" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">UBO</text>
<text x="142" y="229" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Camera (set=0)</text>
<text x="142" y="247" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">カメラ行列</text>

<!-- SSBO: rect y=192 h=74 → 중앙y=229 → 줄: 211 / 229 / 247 -->
<rect x="256" y="192" width="168" height="74" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="211" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">SSBO</text>
<text x="340" y="229" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Object / Texture ID (set=1)</text>
<text x="340" y="247" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">オブジェクト・テクスチャID</text>

<!-- Bindless: rect y=192 h=74 → 중앙y=229 → 줄: 211 / 229 / 247 -->
<rect x="454" y="192" width="168" height="74" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="538" y="211" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Bindless textures</text>
<text x="538" y="229" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Texture array (set=3)</text>
<text x="538" y="247" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">バインドレステクスチャ配列</text>

<line x1="340" y1="280" x2="340" y2="302" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Culling RenderPass ── rect: y=304 h=84 → 중앙y=346 → 줄: 328 / 346 / 364 -->
<rect x="40" y="304" width="600" height="84" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="328" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Culling render pass</text>
<text x="340" y="346" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Shadow map 생성 · 프러스텀 컬링 · 불필요한 오브젝트 제거</text>
<text x="340" y="364" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">シャドウマップ生成・フラスタムカリング・不要オブジェクトの除去</text>

<line x1="340" y1="388" x2="340" y2="410" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Vertex / Fragment ── rect: y=412 h=74 → 중앙y=449 → 줄: 431 / 449 / 467 -->
<rect x="40" y="412" width="600" height="74" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="431" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Vertex / Fragment shader</text>
<text x="340" y="449" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">SSBO에서 텍스처 인덱스 참조 → Bindless texture 샘플링</text>
<text x="340" y="467" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">SSBOからテクスチャインデックスを参照 → バインドレステクスチャサンプリング</text>

<line x1="340" y1="486" x2="340" y2="508" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Lighting Pass ── rect: y=510 h=112 → 중앙y=566 -->
<rect x="40" y="510" width="600" height="112" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="530" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">Lighting pass</text>

<!-- Blinn-Phong: rect y=554 h=54 → 중앙y=581 → 2줄: 572 / 590 -->
<rect x="58" y="554" width="268" height="54" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="192" y="572" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Blinn-Phong shading</text>
<text x="192" y="590" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">Blinn-Phongシェーディング</text>

<!-- Ambient: rect y=554 h=54 → 중앙y=581 → 2줄: 572 / 590 -->
<rect x="354" y="554" width="268" height="54" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="488" y="572" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Ambient · Diffuse · Specular</text>
<text x="488" y="590" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">環境光・拡散光・鏡面反射</text>

<line x1="340" y1="622" x2="340" y2="644" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Post-Processing Pass ── rect: y=646 h=252 → 중앙y=772 -->
<rect x="40" y="646" width="600" height="252" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="666" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">Post-Processing pass — 단일 패스 통합 / 単一パス統合</text>

<!-- Bloom: rect y=690 h=60 → 중앙y=720 → ①제거, 3줄: 702 / 720 / 738 -->
<rect x="58" y="690" width="564" height="60" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="702" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Bloom</text>
<text x="340" y="720" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">pow(luminance, 4) + smoothstep → 고휘도 추출 → Gaussian blur 합산</text>
<text x="340" y="738" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">高輝度領域の抽出 → ガウシアンブラーで加算合成</text>

<line x1="340" y1="750" x2="340" y2="764" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ACES: rect y=766 h=60 → 중앙y=796 → ②제거, 3줄: 778 / 796 / 814 -->
<rect x="58" y="766" width="564" height="60" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="778" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">ACES Filmic Tone Mapping</text>
<text x="340" y="796" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">HDR → LDR · pow(x, 1/2.2) 감마 보정 · 런타임 토글 가능</text>
<text x="340" y="814" font-family="sans-serif" font-size="12" fill="#888780" text-anchor="middle" dominant-baseline="central">HDR→LDR変換・ガンマ補正・ランタイムトグル対応</text>

<line x1="340" y1="826" x2="340" y2="840" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Shadow map: rect y=842 h=40 → 중앙y=862 → 1줄 -->
<rect x="58" y="842" width="564" height="40" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="862" font-family="sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Culling pass의 Shadow map 결과를 입력으로 활용 / カリングパスのシャドウマップを入力として活用</text>

<line x1="340" y1="898" x2="340" y2="918" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Final Output ── -->
<rect x="180" y="920" width="320" height="44" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="942" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Final output</text>

</g>
</svg>
